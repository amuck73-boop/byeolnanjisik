<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별난지식</title>
<meta name="description" content="세상의 '왜?'와 '설마?'를 노란 별 별난이가 그림과 지도로 쉽게 풀어 드립니다.">
<style>
  :root { --bg:#fffbea; --ink:#1f2a44; --sub:#55607a; --accent:#ff9f1c; --card:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a2b; --ink:#f3f4f8; --sub:#b8bfd3; --card:#1e2640; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.7; }
  main { max-width:720px; margin:0 auto; padding:48px 16px 64px; }
  .star { font-size:64px; line-height:1; }
  h1 { font-size:40px; margin:12px 0 4px; }
  .slogan { font-size:22px; font-weight:700; color:var(--accent); margin:0 0 16px; }
  .card { background:var(--card); border-radius:16px; padding:20px 24px; margin:20px 0; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  a { color:var(--accent); font-weight:700; }
  footer { margin-top:40px; font-size:14px; color:var(--sub); }
</style>
</head>
<body>
<main>
  <div class="star">★</div>
  <h1>별난지식</h1>
  <p class="slogan">"에이, 설마?"가 "아하!"로 바뀌는 곳</p>
  <p>세상의 '왜?'와 '설마?'를 노란 별 <b>별난이</b>가 그림과 지도로 쉽게 풀어 드립니다.</p>

  <div class="card">
    <p><b>이런 이야기를 다룹니다</b></p>
    <p>지도로 푸는 나라와 국경의 비밀, 물건 하나로 보는 세계사, 자연과 생물의 반전, 한국에 숨은 별난 지식, 과학의 '설마?', 풀린 미스터리, 요즘 화제를 쉽게.</p>
  </div>

  <div class="card">
    <p><b>보러 가기</b></p>
    <p>유튜브: <a href="https://www.youtube.com/channel/UCPzyaZB0gvB7s8fc79n-fwg">별난지식 채널</a></p>
  </div>

  <footer>
    그림·음악·효과음은 모두 별난지식이 직접 만듭니다. ·
    <a href="privacy.html">개인정보처리방침</a>
  </footer>
</main>
</body>
</html>
